{% extends "base.html" %}

{% block title %}歡迎 - ChainSure{% endblock %}

{% block extra_css %}
<style>
    .welcome-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .welcome-container h1 {
        color: #4a6ee0;
        margin-bottom: 20px;
        font-size: 32px;
        font-weight: bold;
    }

    .user-avatar {
        border-radius: 50%;
        border: 4px solid #64c1ff;
        margin: 20px 0;
        box-shadow: 0 4px 12px rgba(100, 193, 255, 0.3);
    }

    .user-info {
        text-align: left;
        background: rgba(255, 255, 255, 0.8);
        padding: 20px;
        border-radius: 10px;
        margin: 20px 0;
        border-left: 4px solid #88d4ab;
    }

    .user-info p {
        margin: 10px 0;
        color: #555;
        font-size: 16px;
    }

    .logout-btn {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        margin-top: 20px;
    }

    .logout-btn:hover {
        background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }

    .welcome-message {
        color: #666;
        font-size: 18px;
        margin-bottom: 30px;
        line-height: 1.6;
    }
</style>
{% endblock %}

{% block content %}
<div class="welcome-container">
    <h1>歡迎 {{ user['name'] }}</h1>
    
    <div class="welcome-message">
        感謝您使用 ChainSure 智慧保險管理系統
    </div>

    <img src="{{ user['picture'] }}" alt="用戶頭像" width="120" height="120" class="user-avatar">
    
    <div class="user-info">
        <p><strong>姓名：</strong>{{ user['name'] }}</p>
        <p><strong>Email：</strong>{{ user['email'] }}</p>
    </div>

    <button id="logoutButton" class="logout-btn">登出</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 確保 Google 庫已載入
if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
}

// 改用事件監聽器
document.getElementById('logoutButton').addEventListener('click', async function() {
    try {
        const response = await fetch('/logout', { 
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include' // 如果需要傳送 cookies
        });
        
        if (response.ok) {
            window.location.href = '/';
        } else {
            console.error('登出失敗:', response.statusText);
        }
    } catch (error) {
        console.error('登出時發生錯誤:', error);
    }
});

// 頁面載入完成後的初始化
document.addEventListener('DOMContentLoaded', function() {
    console.log('歡迎頁面載入完成');
    
    // 可以添加其他初始化代碼
    const userAvatar = document.querySelector('.user-avatar');
    if (userAvatar) {
        userAvatar.addEventListener('load', function() {
            console.log('用戶頭像載入完成');
        });
        
        userAvatar.addEventListener('error', function() {
            console.log('頭像載入失敗，使用預設頭像');
            this.src = '/static/imgs/default-avatar.png'; // 預設頭像路徑
        });
    }
});
</script>
{% endblock %}
