<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>使用者註冊</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+TC" rel="stylesheet">
    <link href="/static/imgs/icon.jpg" rel="shortcut icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
/* 你的基底設定 */
body {
  margin: 0;
  padding-top: 120px;
  min-height: 100vh;
  background: #1a1a2e;
  color: white;
  font-family: 'Noto Sans TC', Arial, sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
  position: relative;
}

.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%; /* 固定覆蓋整個視窗 */
  background: url('https://cdn.pixabay.com/photo/2017/08/30/02/18/starry-night-2695563_960_720.jpg') repeat; /* 可以改 repeat-y */
  background-size: cover;
  z-index: -999;
  pointer-events: none;
}

/* 閃爍小星星 */
.star {
  position: absolute;
  border-radius: 50%;
  width: 2px;
  height: 2px;
  background-color: white;
  animation: twinkle 1.5s infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.6; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.5); }
}

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: transparent;
  padding: 0.8rem 1.5rem;
  transition: transform 0.3s ease;
}

.navbar.hidden {
  transform: translateY(-100%);
}

.navbar-brand {
  font-weight: bold;
  font-size: 2rem;
  color: #ffffff;
}

.nav-link {
  color: #ffffff;
  font-size: 1.1rem;
  padding: 0.5rem 1rem;
  text-transform: uppercase;
}

.nav-link:hover {
  color: #f39c12;
}

/* Dropdown Menu */
.dropdown-menu {
  min-width: 200px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
  background-color: #222;
  display: none;
}

.nav-item:hover .dropdown-menu {
  display: block;
}

.dropdown-item {
  padding: 12px 16px;
  color: #fff;
  font-size: 1.1rem;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.dropdown-item:hover {
  background-color: #f39c12;
  color: #222;
}

.dropdown-divider {
  border-top: 1px solid #444;
}

/* 容器 */
.container {
  max-width: 600px;
  margin: 40px auto 0 auto;
  padding: 50px 20px 40px 20px;
  z-index: 1;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.6);
  color: #f0f0f5;
  font-weight: 500;
  letter-spacing: 0.03em;
  position: relative;  /* ✅ 要加這個才能讓 z-index 生效 */
  background: rgba(0, 0, 0, 0.85);  /* ✅ 更不透明一點，遮擋星星 */
}

</style>

</head>

<body>
<div class="stars"></div>
<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <a class="navbar-brand" href="/">ChainSure</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="切換導航"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="loginDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            登入
          </a>
          <ul class="dropdown-menu" aria-labelledby="loginDropdown">
            <li><a class="dropdown-item" href="/user/login/form">保人登入</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item" href="/user/login/form">業務員登入</a></li>
          </ul>
        </li>

        
</nav>
    <div class="container">
        <div class="header">
            <h1>使用者註冊</h1>
        </div>


        </ul>

        <div class="content">

            {% if success %}
                <p>✅恭喜，您已成功註冊！</p>
                <a href="/user/login/form" class="btn">立即登入</a>
            {% else %}
                <p>❌註冊失敗</p>
                <p>{{ message }}</p>
            {% endif %}
        </div>

        
    </div>

</head>


</body>
</html>
    <style>
        .header {
            text-align: center;

        }


        .content {

            padding: 30px;

    <script>
          function createStars() {
    const numStars = 200;
    const starsContainer = document.querySelector(".stars");
    const pageHeight = document.body.scrollHeight;

    for (let i = 0; i < numStars; i++) {
        let star = document.createElement("div");
        star.classList.add("star");

        const x = Math.random() * window.innerWidth;
        const y = Math.random() * pageHeight;
        const duration = Math.random() * 2 + 1;
        const delay = Math.random() * 5;

        star.style.top = `${y}px`;
        star.style.left = `${x}px`;
        star.style.animationDuration = `${duration}s`;
        star.style.animationDelay = `${delay}s`;

        starsContainer.appendChild(star);
    }
}

createStars();

// Navbar隱藏顯示的邏輯
let lastScrollTop = 0;
window.addEventListener('scroll', function() {
    const navbar = document.querySelector('.navbar');
    let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
    
    if (currentScroll > lastScrollTop) {
        navbar.classList.add('hidden'); // 向下滾動隱藏navbar
    } else {
        navbar.classList.remove('hidden'); // 向上滾動顯示navbar
    }
    lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; // 防止滾動條小於0
});
    </script>
