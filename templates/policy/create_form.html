{% extends "base.html" %}

{% block title %}確認保單資料 - ChainSure{% endblock %}

{% block extra_css %}
<link href="/static/css/create_form.css" rel="stylesheet">
<style>
    .confirm-container {
        max-width: 800px;
        margin: 80px auto 40px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
    }

    .confirm-container h2 {
        color: #000000;
        margin-bottom: 30px;
        font-size: 2.5rem;
        font-weight: bold;
        text-align: center;
    }

    .wallet-section h3 {
        color: #000000;
        margin-bottom: 20px;
        text-align: center;
        font-size: 1.5rem;
    }

    .wallet-label {
        font-weight: bold;
        color: #000000;
        min-width: 120px;
    }

    .wallet-address {
        font-family: 'Courier New', monospace;
        background: #f8f9fa;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        flex-grow: 1;
        margin: 0 15px;
        word-break: break-all;
        color: #000000;
    }

    .form-row label {
        font-weight: bold;
        color: #000000;
        margin-bottom: 8px;
        display: block;
    }

    .form-row input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #f8f9fa;
        box-sizing: border-box;
        color: #000000;
    }

    .form-row input:read-only {
        background: #f8f9fa;
        color: #000000;
        cursor: not-allowed;
    }

    .wallet-tips {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #000000;
        background: rgba(255, 255, 255, 0.7);
        padding: 10px;
        border-radius: 8px;
    }

    /* 其他樣式保持不變 */
    .required-label {
        color: #ff6b6b;
    }

    .status-connected {
        background: #d4edda;
        color: #155724;
    }

    .status-not-set {
        background: #fff3cd;
        color: #856404;
    }

    .status-error {
        background: #f8d7da;
        color: #721c24;
    }

    .btn-refresh {
        background: linear-gradient(135deg, #6c757d, #5a6268);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        margin: 0 auto;
    }

    .btn-refresh:hover {
        background: linear-gradient(135deg, #5a6268, #495057);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
    }

    .submit {
        background: linear-gradient(135deg, #8ac6ff, #64c1ff);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(100, 193, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 auto 15px;
    }

    .submit:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(74, 110, 224, 0.4);
    }

    .btn-secondary {
        background: linear-gradient(135deg, #a8e6cf, #88d4ab);
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(136, 212, 171, 0.3);
        margin-left: 15px;
    }

    .btn-secondary:hover {
        background: linear-gradient(135deg, #88d4ab, #6bc49c);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(107, 196, 156, 0.4);
    }

    #status {
        text-align: center;
        font-weight: bold;
        padding: 15px;
        border-radius: 8px;
        color: #000000;
    }

    .divider {
        height: 2px;
        background: linear-gradient(90deg, transparent, #64c1ff, transparent);
        margin: 30px 0;
    }

    .upload-section {
        text-align: center;
        margin: 20px 0;
        padding: 20px;
        background: rgba(248, 249, 250, 0.8);
        border-radius: 10px;
        border: 1px solid #e0e0e0;
    }

    .upload-section a {
        color: #4a6ee0;
        text-decoration: none;
        font-weight: bold;
    }

    .upload-section a:hover {
        color: #64c1ff;
        text-decoration: underline;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .confirm-container {
            margin: 60px 20px 20px;
            padding: 30px 20px;
        }

        .wallet-info {
            flex-direction: column;
            align-items: flex-start;
        }

        .wallet-address {
            margin: 10px 0;
            width: 100%;
        }

        .submit, .btn-secondary {
            width: 100%;
            margin: 10px 0;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="confirm-container">
    <h2>確認保單資料</h2>

    <div class="form-wrapper">
        <form id="policyForm">
            <!-- 錢包資訊部分 - 移除業務員錢包 -->
            <div class="wallet-section">
                <h3>錢包資訊</h3>
                <button type="button" class="btn-refresh" onclick="loadWalletAddress()">
                    🔄 重新載入錢包地址
                </button>
                
                <div class="wallet-info">
                    <span class="wallet-label">您的錢包地址:</span>
                    <span class="wallet-address" id="userWalletAddress">載入中...</span>
                    <span class="wallet-status status-connected" id="userWalletStatus">已連接</span>
                </div>

                <div class="wallet-tips">
                    💡 錢包地址自動載入，請確保目前錢包地址和註冊時一樣
                </div>
            </div>

            <div class="divider"></div>

            <!-- 隱藏欄位 -->
            <input type="hidden" id="clientGmail" value="{{ current_user.id }}">
            <input type="hidden" id="officerGmail" value="{{ policy.officer_gmail }}">
            <input type="hidden" id="pdfHash" value="{{ policy.pdf_hash }}">

            <!-- 表單欄位 -->
            <div class="form-row">
                <label for="policyNumber">保單編號 <span class="required-label">*</span></label>
                <input type="text" id="policyNumber" required readonly />
            </div>

            <div class="form-row">
                <label for="insuranceCompany">保險公司名稱 <span class="required-label">*</span></label>
                <input type="text" id="insuranceCompany" required readonly />
            </div>

            <div class="form-row">
                <label for="policyHolder">投保人姓名 <span class="required-label">*</span></label>
                <input type="text" id="policyHolder" required readonly />
            </div>

            <div class="form-row">
                <label for="insuredPerson">被保險人姓名 <span class="required-label">*</span></label>
                <input type="text" id="insuredPerson" required readonly />
            </div>

            <div class="form-row">
                <label for="insuranceAmount">保險金額 (NTD) <span class="required-label">*</span></label>
                <input type="number" id="insuranceAmount" step="0.01" required readonly />
            </div>

            <div class="form-row">
                <label for="premiumPeriod">繳費期間 (年) <span class="required-label">*</span></label>
                <input type="number" id="premiumPeriod" required readonly />
            </div>

            <div class="form-row">
                <label for="premiumAmount">保費金額 (NTD) <span class="required-label">*</span></label>
                <input type="number" id="premiumAmount" step="0.01" required readonly />
            </div>

            <div class="form-row">
                <label for="startDate">生效日期 <span class="required-label">*</span></label>
                <input type="date" id="startDate" required readonly />
            </div>

            <div class="form-row">
                <label for="beneficiary">受益人 <span class="required-label">*</span></label>
                <input type="text" id="beneficiary" required readonly />
            </div>

            <div class="form-row">
                <label for="growthRate">增額比例 (%) <span class="required-label">*</span></label>
                <input type="number" id="growthRate" required readonly />
            </div>

            <div class="form-row">
                <label for="declaredInterestRate">宣告利率 (%) <span class="required-label">*</span></label>
                <input type="number" id="declaredInterestRate" required readonly />
            </div>

            <div class="divider"></div>

            <div class="upload-section">
                <label>
                    已上傳 PDF 文件：
                    {% if policy.pdf_hash %}
                        <a href="http://127.0.0.1:8080/ipfs/{{ policy.pdf_hash }}" target="_blank">查看 PDF</a>
                    {% else %}
                        無文件
                    {% endif %}
                </label>
            </div>

            <div class="mt-4 text-center">
                <button type="submit" class="submit">
                    <img src="{{ url_for('static', filename='imgs/send.png') }}" alt="Send Icon" class="icon">確認上鏈
                </button>
                
            </div>

            <div id="status" class="mt-3"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eth-crypto@2.3.0/dist/eth-crypto-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="/static/js/create_form.js"></script>

<script>
    // 自動填值 (假設後端會渲染資料到這裡)
    window.onload = function() {
        document.getElementById("policyNumber").value = "{{ policy.policy_number }}";
        document.getElementById("insuranceCompany").value = "{{ policy.insurance_company }}";
        document.getElementById("policyHolder").value = "{{ policy.policy_holder }}";
        document.getElementById("insuredPerson").value = "{{ policy.insured_person }}";
        document.getElementById("insuranceAmount").value = "{{ policy.insurance_amount }}";
        document.getElementById("premiumPeriod").value = "{{ policy.premium_period }}";
        document.getElementById("premiumAmount").value = "{{ policy.premium_amount }}";
        document.getElementById("startDate").value = "{{ policy.start_date }}";
        document.getElementById("beneficiary").value = "{{ policy.beneficiary }}";
        document.getElementById("growthRate").value = "{{ policy.growth_rate }}";
        document.getElementById("declaredInterestRate").value = "{{ policy.declared_interest_rate }}";
    }

    function modifyPolicy() {
        window.location.href = '/policy/update/form?policy_number={{ policy.policy_number }}';
    }
</script>
{% endblock %}
