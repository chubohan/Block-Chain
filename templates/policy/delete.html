{% extends "base.html" %}

{% block title %}客戶刪除 - ChainSure{% endblock %}

{% block content %}
<div class="container">
    <h2>客戶刪除</h2>

    {% if success %}
        <p class="alert alert-success">刪除成功</p>
    {% else %}
        <p class="alert alert-danger">刪除失敗</p>
    {% endif %}

    <a href="/" class="btn btn-primary">返回主頁</a>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
   
<script>
    function checkPW(){
        var pw1 = document.getElementById("pw1").value;
        var pw2 = document.getElementById("pw2").value;
        
        if (pw1 != pw2) {
            swal('輸入錯誤', '[密碼]與[確認密碼]輸入的內容不同!', 'error');
            return false;
        } else {
            return true;	
        }
    }
</script>
{% endblock %}
