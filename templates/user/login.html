{% extends "base.html" %}

{% block title %}使用者登入 - ChainSure{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 450px;
        margin: 40px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .login-container h2 {
        color: #4a6ee0;
        margin-bottom: 30px;
        font-size: 28px;
        font-weight: bold;
    }

    .login-form {
        text-align: left;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: white;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: #64c1ff;
        box-shadow: 0 0 0 3px rgba(100, 193, 255, 0.1);
    }

    .login-btn {
        width: 100%;
        background: linear-gradient(135deg, #8ac6ff, #64c1ff);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(100, 193, 255, 0.3);
    }

    .login-btn:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(74, 110, 224, 0.4);
    }

    .message {
        background: linear-gradient(135deg, #ffd89b, #ffb347);
        color: white;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: bold;
    }

    .footer {
        margin-top: 25px;
        font-size: 14px;
        color: #666;
        text-align: center;
    }

    .footer a {
        color: #64c1ff;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s ease;
    }

    .footer a:hover {
        color: #4a6ee0;
        text-decoration: underline;
    }

    .form-control::placeholder {
        color: #999;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .login-container {
            margin: 20px;
            padding: 30px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <h2>使用者登入</h2>
    
    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}
    
    <form class="login-form" action="/user/login" method="POST">
        <div class="mb-3">
            <input type="email" class="form-control" name="email" placeholder="電子郵件" required>
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" name="password" placeholder="密碼" required>
        </div>
        <button type="submit" class="login-btn">登入</button>
    </form>
    
    <div class="footer">
        <p>還沒有帳號？ <a href="/user/register">立即註冊</a></p>
        <p><a href="/user/resend_verify">重新寄送驗證郵件</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 自動聚焦到第一個輸入框
    document.addEventListener('DOMContentLoaded', function() {
        const firstInput = document.querySelector('input[type="email"]');
        if (firstInput) {
            firstInput.focus();
        }
    });

    // 表單驗證增強
    document.querySelector('form').addEventListener('submit', function(e) {
        const email = document.querySelector('input[type="email"]').value;
        const password = document.querySelector('input[type="password"]').value;
        
        // 簡單的郵件格式驗證
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            e.preventDefault();
            alert('請輸入有效的電子郵件地址');
            return;
        }
        
        // 密碼長度檢查
        if (password.length < 6) {
            e.preventDefault();
            alert('密碼長度至少需要6個字符');
            return;
        }
        
        console.log("登入表單提交");
    });
</script>
{% endblock %}
