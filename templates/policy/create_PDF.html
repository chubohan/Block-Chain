{% extends "base.html" %}

{% block title %}PDF上傳 - ChainSure{% endblock %}

{% block content %}
<div class="container">
    <h2>PDF上傳處理</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <input type="file" name="file" accept=".pdf" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">上傳並處理PDF</button>
    </form>
    
    {% if pdf_hash %}
    <div class="mt-4">
        <h3>處理結果</h3>
        <p><strong>PDF雜湊值:</strong> {{ pdf_hash }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
