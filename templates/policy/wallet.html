{% extends "base.html" %}

{% block title %}ChainSure - 智慧保險管理{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="/static/css/index.css" rel="stylesheet">
{% endblock %}

{% block content %}
<button id="connectBtn" class="btn btn-warning" onclick="connectWallet()">連接錢包</button>
<p>當前錢包地址：<span id="walletAddress">尚未連接</span></p>

<button id="confirmButton" onclick="confirmConnection()">✅ 確認連接</button>

<p class="mt-4 text-white" style="font-size: 14px;">
    我是聲明
</p>

<div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" id="agreeCheckbox" />
    <label class="form-check-label text-white" for="agreeCheckbox">
        我已閱讀並同意上述聲明
    </label>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
<script src="/static/js/wallet.js"></script>
{% endblock %}
