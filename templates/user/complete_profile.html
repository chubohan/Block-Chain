{% extends "base.html" %}

{% block title %}補全資料 - ChainSure{% endblock %}

{% block extra_css %}
<style>
    .profile-form-container {
        max-width: 500px;
        margin: 40px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .profile-form-container h1 {
        color: #4a6ee0;
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 30px;
        border-bottom: 2px solid #64c1ff;
        padding-bottom: 15px;
    }

    .form-group {
        margin-bottom: 25px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: bold;
        font-size: 16px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: white;
        box-sizing: border-box;
        color: #333;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #64c1ff;
        box-shadow: 0 0 0 3px rgba(100, 193, 255, 0.1);
    }

    .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #8ac6ff, #64c1ff);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(100, 193, 255, 0.3);
    }

    .submit-btn:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(74, 110, 224, 0.4);
    }

    .instructions {
        color: #666;
        font-size: 14px;
        margin-top: 8px;
        text-align: center;
        line-height: 1.5;
    }

    .form-note {
        background: rgba(100, 193, 255, 0.1);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 25px;
        border-left: 4px solid #64c1ff;
    }

    .form-note p {
        margin: 0;
        color: #555;
        font-size: 14px;
        line-height: 1.5;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .profile-form-container {
            margin: 20px;
            padding: 30px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="profile-form-container">
    <h1>請補全您的資料</h1>
    
    <div class="form-note">
        <p>為了提供更好的服務體驗，請填寫以下基本資料</p>
    </div>

    <form id="profileForm">
        <div class="form-group">
            <label for="age">年齡：</label>
            <input type="number" id="age" name="age" min="18" max="120" required placeholder="請輸入您的年齡">
            <div class="instructions">請輸入18-120歲之間的數字</div>
        </div>
        
        <div class="form-group">
            <label for="gender">性別：</label>
            <select id="gender" name="gender" required>
                <option value="">請選擇性別</option>
                <option value="male">男性</option>
                <option value="female">女性</option>
            </select>
        </div>
        
        <button type="submit" class="submit-btn">提交資料</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = {
            age: e.target.age.value,
            gender: e.target.gender.value
        };

        // 表單驗證
        if (!formData.age || !formData.gender) {
            alert('請填寫所有必填欄位');
            return;
        }

        if (formData.age < 18 || formData.age > 120) {
            alert('請輸入有效的年齡（18-120歲）');
            return;
        }

        try {
            const response = await fetch('/user/complete-profile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            if (result.success) {
                // 顯示成功訊息
                const submitBtn = document.querySelector('.submit-btn');
                submitBtn.textContent = '提交成功！';
                submitBtn.style.background = 'linear-gradient(135deg, #a8e6cf, #88d4ab)';
                
                // 延遲跳轉
                setTimeout(() => {
                    if (result.redirect) {
                        window.location.href = result.redirect;
                    } else {
                        window.location.href = '/';
                    }
                }, 1500);
            } else {
                alert('錯誤: ' + (result.error || '提交失敗，請重試'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('提交失敗，請檢查網路連線後重試');
        }
    });

    // 自動聚焦到年齡輸入框
    document.addEventListener('DOMContentLoaded', function() {
        const ageInput = document.getElementById('age');
        if (ageInput) {
            ageInput.focus();
        }
    });

    // 即時驗證
    document.getElementById('age').addEventListener('input', function() {
        const age = parseInt(this.value);
        if (age < 18 || age > 120) {
            this.style.borderColor = '#ff6b6b';
        } else {
            this.style.borderColor = '#88d4ab';
        }
    });

    document.getElementById('gender').addEventListener('change', function() {
        if (this.value) {
            this.style.borderColor = '#88d4ab';
        } else {
            this.style.borderColor = '#e0e0e0';
        }
    });
</script>
{% endblock %}
