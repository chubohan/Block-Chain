{% extends "base.html" %}

{% block title %}新增保險計畫{% endblock %}

{% block extra_css %}
<style>
    /* 繼承主樣式並添加表單特定樣式 */
    .header {
        text-align: center;
        margin-bottom: 40px;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
    }

    .header h1 {
        color: #2d4fc6;
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .header p {
        color: #666;
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
    }

    .back-btn {
        background: linear-gradient(135deg, #6c757d, #5a6268);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
    }

    .back-btn:hover {
        background: linear-gradient(135deg, #5a6268, #495057);
        transform: translateY(-2px);
    }

    /* Form Styles */
    .form-section {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        margin-bottom: 40px;
    }

    .form-section h2 {
        color: #2d4fc6;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2rem;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        margin-bottom: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full-width {
        grid-column: 1 / -1;
    }

    .form-label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #000000;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-input, .form-textarea, .form-file {
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: white;
        color: #000000;
    }

    .form-input:focus, .form-textarea:focus, .form-file:focus {
        outline: none;
        border-color: #4a6ee0;
        box-shadow: 0 0 0 3px rgba(74, 110, 224, 0.1);
    }

    .form-textarea {
        resize: vertical;
        min-height: 120px;
        font-family: inherit;
    }

    .form-file {
        padding: 10px;
    }

    .create-btn-container {
        text-align: center;
        margin-top: 20px;
    }

    .btn-create {
        background: linear-gradient(135deg, #28a745, #20c997);
        color: white;
        padding: 15px 40px;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .btn-create:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    .btn-create:disabled {
        background: #6c757d;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* File Upload Styling */
    .file-upload-container {
        position: relative;
        display: inline-block;
        width: 100%;
    }

    .file-upload-label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: white;
        border: 2px dashed #4a6ee0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #4a6ee0;
        font-weight: 600;
    }

    .file-upload-label:hover {
        background: rgba(74, 110, 224, 0.05);
    }

    .file-upload-input {
        position: absolute;
        left: -9999px;
    }

    /* Status Messages */
    .status-message {
        padding: 15px;
        border-radius: 10px;
        margin: 10px 0;
        text-align: center;
        font-weight: 600;
    }

    .status-success {
        background: rgba(40, 167, 69, 0.1);
        color: #28a745;
        border: 1px solid #28a745;
    }

    .status-error {
        background: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        border: 1px solid #dc3545;
    }

    .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #4a6ee0;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <!-- Back Button -->
    <a href="{{ url_for('index') }}" class="back-btn">
        <i class="fas fa-arrow-left"></i> 返回首頁
    </a>

    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-plus-circle"></i> 新增保險計畫</h1>
        <p>創建新的保險提案，開始您的去中心化保險治理</p>
    </div>

    <!-- Create DAO Form -->
    <div class="form-section">
        <h2><i class="fas fa-file-contract"></i> 保險計畫資訊</h2>
        
        <div id="formStatus"></div>
        
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-signature"></i> 提案名稱
                </label>
                <input type="text" id="daoName" class="form-input" placeholder="例如：汽車保險計畫">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-coins"></i> 月保費 (ETH)
                </label>
                <input type="text" id="monthlyPremium" class="form-input" placeholder="例如：0.01">
            </div>

            <div class="form-group full-width">
                <label class="form-label">
                    <i class="fas fa-file-alt"></i> 理賠內容
                </label>
                <textarea id="claimDescription" class="form-textarea" placeholder="請詳細描述理賠內容、條件和規則..."></textarea>
            </div>

            <div class="form-group full-width">
                <label class="form-label">
                    <i class="fas fa-file-pdf"></i> 上傳 PDF 申請表
                </label>
                <div class="file-upload-container">
                    <label for="pdfFile" class="file-upload-label">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="fileLabel">選擇 PDF 檔案</span>
                    </label>
                    <input type="file" id="pdfFile" class="file-upload-input" accept="application/pdf">
                </div>
            </div>
        </div>

        <div class="create-btn-container">
            <button id="createDaoBtn" class="btn btn-create">
                <i class="fas fa-rocket"></i> 發起提案
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    let provider;
    let signer;
    let factoryContract;
    let userWalletAddress = null;

    const factoryAbi = [
        "function createDAO(string memory daoName, uint256 monthlyPremium, string memory claimDesc, string memory pdfHash) public",
        "function getDAOAddresses() public view returns(address[])"
    ];
    const factoryAddress = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";

    // 頁面載入時初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadWalletAddress();
        
        // File upload handling
        document.getElementById('pdfFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileLabel = document.getElementById('fileLabel');
            if (file) {
                fileLabel.textContent = file.name;
            } else {
                fileLabel.textContent = '選擇 PDF 檔案';
            }
        });
    });

    // 載入錢包地址並初始化合約
    async function loadWalletAddress() {
        try {
            const response = await fetch('/policy/get_wallet_addresses');
            const data = await response.json();

            if (data.success && data.user_wallet) {
                userWalletAddress = data.user_wallet;
                await initWeb3AndContract();
            } else {
                showStatus('請先設定錢包地址', 'error');
            }
        } catch (error) {
            console.error('載入錢包地址失敗:', error);
            showStatus('載入錢包地址失敗', 'error');
        }
    }

    // 初始化 Web3 和合約
    async function initWeb3AndContract() {
        try {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await window.ethereum.request({ 
                    method: "eth_requestAccounts" 
                });
                
                const currentAccount = accounts[0];
                if (currentAccount.toLowerCase() !== userWalletAddress.toLowerCase()) {
                    showStatus(`錢包地址不匹配，請切換到正確的錢包`, 'error');
                    return false;
                }
                
                signer = provider.getSigner();
                factoryContract = new ethers.Contract(factoryAddress, factoryAbi, signer);
                showStatus('錢包和合約初始化成功', 'success');
                return true;
            } else {
                showStatus('請安裝 MetaMask 錢包擴展', 'error');
                return false;
            }
        } catch (error) {
            console.error('初始化 Web3 失敗:', error);
            showStatus('初始化失敗: ' + error.message, 'error');
            return false;
        }
    }

    // 上傳PDF到IPFS
    async function uploadPDFtoIPFS(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch("http://127.0.0.1:5001/api/v0/add", {
                method: "POST",
                body: formData
            });

            const text = await res.text();
            const match = text.match(/"Hash":"([^"]+)"/);
            return match ? match[1] : null;
        } catch (error) {
            console.error('IPFS upload error:', error);
            return null;
        }
    }

    // 顯示狀態訊息
    function showStatus(message, type) {
        const statusDiv = document.getElementById('formStatus');
        statusDiv.innerHTML = `<div class="status-message status-${type}">${message}</div>`;
        
        if (type === 'success') {
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }
    }

    // 創建DAO
    async function createDAO() {
        const daoName = document.getElementById("daoName").value;
        const premiumInput = document.getElementById("monthlyPremium").value;
        const claimDesc = document.getElementById("claimDescription").value;
        const pdfFile = document.getElementById("pdfFile").files[0];

        if (!daoName || !premiumInput || !claimDesc || !pdfFile) {
            showStatus("請完整填寫所有欄位並上傳 PDF", 'error');
            return;
        }

        try {
            if (!factoryContract) {
                showStatus('合約未初始化，請重新載入頁面', 'error');
                return;
            }

            const createBtn = document.getElementById('createDaoBtn');
            createBtn.innerHTML = '<div class="loading"></div> 創建中...';
            createBtn.disabled = true;

            showStatus('正在上傳 PDF 文件到 IPFS...', 'success');

            const pdfHash = await uploadPDFtoIPFS(pdfFile);
            if (!pdfHash) {
                showStatus("PDF 上傳 IPFS 失敗", 'error');
                createBtn.innerHTML = '<i class="fas fa-rocket"></i> 發起提案';
                createBtn.disabled = false;
                return;
            }

            showStatus('PDF 上傳成功，正在創建智能合約...', 'success');

            const premiumWei = ethers.utils.parseEther(premiumInput);
            
            const tx = await factoryContract.createDAO(daoName, premiumWei, claimDesc, pdfHash);
            showStatus('交易已提交，等待確認...', 'success');
            
            await tx.wait();

            showStatus('保險計畫創建成功！', 'success');
            createBtn.innerHTML = '<i class="fas fa-check"></i> 創建成功';

            // 重置表單
            setTimeout(() => {
                document.getElementById("daoName").value = '';
                document.getElementById("monthlyPremium").value = '';
                document.getElementById("claimDescription").value = '';
                document.getElementById("pdfFile").value = '';
                document.getElementById("fileLabel").textContent = '選擇 PDF 檔案';
                createBtn.innerHTML = '<i class="fas fa-rocket"></i> 發起提案';
                createBtn.disabled = false;
            }, 3000);

        } catch (err) {
            console.error(err);
            showStatus("創建提案失敗：" + err.message, 'error');
            document.getElementById('createDaoBtn').innerHTML = '<i class="fas fa-rocket"></i> 發起提案';
            document.getElementById('createDaoBtn').disabled = false;
        }
    }

    // Event listeners
    document.getElementById("createDaoBtn").addEventListener("click", createDAO);
</script>
{% endblock %}
