<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 漸層定義 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007BFF;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- 外圓框 -->
  <circle cx="50" cy="50" r="48" stroke="url(#grad1)" stroke-width="5" fill="none"></circle>

  <!-- 鏈式元素 -->
  <circle cx="35" cy="50" r="6" fill="#007BFF" opacity="0.8"></circle>
  <circle cx="50" cy="50" r="6" fill="#00D4FF" opacity="0.8"></circle>
  <circle cx="65" cy="50" r="6" fill="#007BFF" opacity="0.8"></circle>
  <line x1="35" y1="50" x2="65" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round"></line>

  <!-- 品牌縮寫 -->
  <text x="50%" y="70%" text-anchor="middle" fill="white" font-size="22" font-family="Arial" font-weight="bold">CS</text>
</svg>
