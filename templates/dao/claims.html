{% extends "base.html" %}

{% block title %}DAO 歷史理賠記錄 - ChainSure{% endblock %}

{% block extra_css %}
<style>
    /* 主要內容區域樣式 */
    .dao-history-container {
		margin: 120px auto; /* 水平置中 */
        margin-top: 120px;
        width: 90%;
        max-width: 1200px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(74, 110, 224, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 導航區域 */
    .dao-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid rgba(74, 110, 224, 0.1);
    }

    .dao-title {
        color: #2d4fc6;
        font-weight: bold;
        margin: 0;
        font-size: 2.2rem;
        text-shadow: 0 2px 4px rgba(45, 79, 198, 0.1);
    }

    /* DAO 信息卡片 */
    .dao-info-card {
        background: linear-gradient(135deg, rgba(74, 110, 224, 0.1), rgba(100, 193, 255, 0.1));
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        border: 1px solid rgba(74, 110, 224, 0.2);
        box-shadow: 0 4px 15px rgba(74, 110, 224, 0.1);
    }

    .dao-info-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        color: #2d4fc6;
        font-weight: 500;
    }

    .dao-info-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dao-info-item i {
        color: #64c1ff;
        font-size: 1.1rem;
    }

    /* 理賠項目樣式 */
    .claims-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .claim-item {
        background: linear-gradient(135deg, #ffffff, #f8faff);
        border-radius: 15px;
        padding: 25px;
        border: 1px solid rgba(74, 110, 224, 0.15);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .claim-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 5px;
        height: 100%;
        background: linear-gradient(135deg, #4a6ee0, #64c1ff);
    }

    .claim-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 30px rgba(74, 110, 224, 0.2);
    }

    .claim-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
    }

    .claim-title {
        color: #2d4fc6;
        font-weight: bold;
        font-size: 1.4rem;
        margin: 0;
    }

    .claim-status {
        padding: 6px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .status-approved {
        background: linear-gradient(135deg, #a8e6cf, #88d4ab);
        color: #059669;
    }

    .status-rejected {
        background: linear-gradient(135deg, #ffb8b8, #ff9a9a);
        color: #dc2626;
    }

    .claim-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        margin-bottom: 15px;
    }

    .claim-detail {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .detail-label {
        color: #666;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .detail-value {
        color: #333;
        font-weight: 600;
        font-size: 1rem;
    }

    .claim-amount {
        color: #2d4fc6;
        font-weight: bold;
        font-size: 1.2rem;
    }

    .claim-votes {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }

    .vote-count {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 15px;
        font-weight: 600;
    }

    .vote-yes {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
    }

    .vote-no {
        background: rgba(220, 38, 38, 0.1);
        color: #dc2626;
    }

    .claim-file {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(74, 110, 224, 0.1);
    }

    .file-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4a6ee0;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 15px;
        border-radius: 8px;
        background: rgba(74, 110, 224, 0.1);
        transition: all 0.3s ease;
    }

    .file-link:hover {
        background: rgba(74, 110, 224, 0.2);
        color: #2d4fc6;
        transform: translateY(-1px);
    }

    /* 載入和錯誤狀態 */
    .loading-state, .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #666;
    }

    .loading-state i, .empty-state i {
        font-size: 3rem;
        color: #64c1ff;
        margin-bottom: 20px;
    }

    .loading-state h3, .empty-state h3 {
        color: #2d4fc6;
        margin-bottom: 10px;
    }

    .error-state {
        background: linear-gradient(135deg, #ffe6e6, #ffcccc);
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        border: 1px solid rgba(220, 38, 38, 0.2);
    }

    .error-state h3 {
        color: #dc2626;
        margin-bottom: 15px;
    }

    .error-state p {
        color: #666;
        margin-bottom: 20px;
    }

    /* 按鈕樣式 */
    .btn-back {
        background: linear-gradient(135deg, #8ac6ff, #64c1ff);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-back:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(100, 193, 255, 0.3);
        color: white;
    }

    .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .dao-history-container {
            margin-top: 100px;
            width: 95%;
            padding: 25px;
        }

        .dao-nav {
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .dao-title {
            font-size: 1.8rem;
        }

        .dao-info-content {
            grid-template-columns: 1fr;
        }

        .claim-header {
            flex-direction: column;
            gap: 10px;
        }

        .claim-details {
            grid-template-columns: 1fr;
        }

        .claim-votes {
            justify-content: center;
        }
    }

    @media (max-width: 576px) {
        .dao-history-container {
            padding: 20px;
        }

        .claim-item {
            padding: 20px;
        }

        .btn-group {
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="dao-history-container">
    <!-- 導航區域 -->
    <div class="dao-nav">
        <button id="backButton" class="btn-back">
            <i class="fas fa-arrow-left"></i>返回提案詳情
        </button>
        <h1 class="dao-title">歷史理賠紀錄</h1>
    </div>

    <!-- DAO 信息卡片 -->
    <div id="daoInfo" class="dao-info-card">
        <div class="dao-info-content">
            <div class="dao-info-item">
                <i class="fas fa-spinner fa-spin"></i>
                <span>載入中...</span>
            </div>
        </div>
    </div>

    <!-- 歷史理賠容器 -->
    <div id="historyContainer" class="claims-container">
        <div class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <h3>載入歷史記錄中...</h3>
            <p>正在從區塊鏈獲取理賠數據</p>
        </div>
    </div>
</div>
{% endblock %}

    let provider;
    let daoContract;
    let daoAddress;

    // 從當前 URL 獲取 DAO 地址
    function getDaoAddressFromCurrentUrl() {
        // 方法1: 從路徑參數獲取 (新路由: /dao/0x.../claims)
        const pathSegments = window.location.pathname.split('/').filter(segment => segment);
        const daoIndex = pathSegments.indexOf('dao');
        
        if (daoIndex !== -1 && daoIndex + 1 < pathSegments.length) {
            const address = pathSegments[daoIndex + 1];
            if (ethers.utils.isAddress(address)) {
                return address;
            }
        }
        
        // 方法2: 從查詢參數獲取 (舊路由: /claims.html?address=0x...)
        const urlParams = new URLSearchParams(window.location.search);
        const addressFromQuery = urlParams.get('address');
        if (addressFromQuery && ethers.utils.isAddress(addressFromQuery)) {
            return addressFromQuery;
        }
        
        return null;
    }

    async function initApp() {
        // 獲取 DAO 地址
        daoAddress = getDaoAddressFromCurrentUrl();
        
        console.log("解析到的 DAO 地址:", daoAddress);
        
        if (!daoAddress) {
            showError("未找到有效的 DAO 地址。請從 DAO 詳細頁面訪問此頁面。");
            return;
        }
        
        if (!window.ethereum) {
            showError("請安裝 MetaMask 錢包");
            return;
        }
        
        try {
            // 連接錢包
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            // 使用校驗和地址創建合約實例
            const checksumAddress = ethers.utils.getAddress(daoAddress);
            daoContract = new ethers.Contract(checksumAddress, daoABI, provider);
            
            // 測試合約連接並獲取 DAO 信息
            await loadDaoInfo();
            await loadHistoryClaims();
            
        } catch (err) {
            console.error("初始化失敗:", err);
            showError("無法連接到 DAO 合約: " + (err.message || "請確認合約地址正確且網絡連接正常"));
        }
        
        // 設置返回按鈕
        setupEventListeners();
    }

    // 加載 DAO 基本信息
    async function loadDaoInfo() {
        try {
            const [daoName, memberCount, totalClaims] = await Promise.all([
                daoContract.getDAOName(),
                daoContract.getMemberCount(),
                daoContract.getTotalClaims()
            ]);
            
            document.getElementById("daoInfo").innerHTML = `
                <strong>理賠計畫:</strong> ${daoName} | 
                <strong>成員數:</strong> ${memberCount.toString()} | 
                <strong>總理賠數:</strong> ${totalClaims.toString()} |
                <strong>地址:</strong> ${daoAddress}
            `;
            
        } catch (err) {
            console.error("載入 DAO 信息失敗:", err);
            document.getElementById("daoInfo").textContent = `DAO 地址: ${daoAddress} (無法載入詳細信息)`;
        }
    }

    async function loadHistoryClaims() {
        try {
            const historyContainer = document.getElementById("historyContainer");
            historyContainer.innerHTML = "<div class='loading'>正在載入歷史理賠記錄...</div>";
            
            let totalClaims;
            try {
                totalClaims = await daoContract.getTotalClaims();
            } catch (err) {
                console.log("getTotalClaims() 失敗，嘗試其他方法");
                try {
                    totalClaims = await daoContract.claimCount();
                } catch (err2) {
                    console.log("所有方法都失敗，可能沒有理賠記錄");
                    totalClaims = ethers.BigNumber.from(0);
                }
            }
            
            console.log("總理賠數量:", totalClaims.toString());
            
            historyContainer.innerHTML = "";

            if (totalClaims.eq(0)) {
                historyContainer.innerHTML = "<div class='loading'>目前沒有任何理賠記錄</div>";
                return;
            }

            // 加載所有已完成的理賠
            let completedClaims = 0;
            let claimsLoaded = 0;
            
            for (let i = 0; i < totalClaims.toNumber(); i++) {
                try {
                    const claim = await daoContract.getClaim(i);
                    claimsLoaded++;
                    
                    // 只顯示已執行的理賠
                    if (claim.executed) {
                        await renderClaim(i, claim, historyContainer);
                        completedClaims++;
                    }
                } catch (err) {
                    console.warn(`理賠 #${i} 載入失敗:`, err.message);
                    continue;
                }
            }
            
            console.log(`載入完成: ${claimsLoaded} 個理賠，其中 ${completedClaims} 個已完成`);
            
            if (completedClaims === 0) {
                if (claimsLoaded > 0) {
                    historyContainer.innerHTML = "<div class='loading'>沒有已完成的理賠記錄（所有理賠都在進行中）</div>";
                } else {
                    historyContainer.innerHTML = "<div class='loading'>無法載入任何理賠記錄</div>";
                }
            }
            
        } catch (err) {
            console.error("載入歷史記錄失敗:", err);
            showError("載入歷史記錄失敗: " + err.message);
        }
    }

    async function renderClaim(claimId, claim, container) {
        try {
            // 檢查理賠數據是否有效
            if (!claim || claim.claimant === ethers.constants.AddressZero) {
                return;
            }

            const isPassed = claim.yesVotes > claim.noVotes;
            const statusText = isPassed 
                ? '<span class="status-approved">✓ 已通過並支付</span>' 
                : '<span class="status-rejected">✗ 已拒絕</span>';

            const claimDiv = document.createElement("div");
            claimDiv.className = "claim-item";
            claimDiv.innerHTML = `
                <h3>理賠 #${claimId + 1}</h3>
                <div><strong>申請人:</strong> ${claim.claimant}</div>
                <div><strong>申請時間:</strong> ${new Date(claim.createdAt * 1000).toLocaleString('zh-TW')}</div>
                <div><strong>金額:</strong> ${ethers.utils.formatEther(claim.amount)} ETH</div>
                <div><strong>原因:</strong> ${claim.reason || '無說明'}</div>
                <div><strong>狀態:</strong> ${statusText}</div>
                <div><strong>投票結果:</strong> 
                    <span style="color: green; font-weight: bold;">贊成 ${claim.yesVotes.toString()}</span> / 
                    <span style="color: red; font-weight: bold;">反對 ${claim.noVotes.toString()}</span>
                </div>
                ${claim.pdfHash && claim.pdfHash !== "" ? `
                    <div><strong>相關文件:</strong> 
                        <a href="https://ipfs.io/ipfs/${claim.pdfHash}" target="_blank" style="color: #007bff;">查看理賠文件</a>
                    </div>
                ` : ''}
            `;
            
            container.appendChild(claimDiv);
        } catch (err) {
            console.error(`渲染理賠 #${claimId} 時出錯:`, err);
        }
    }

    function setupEventListeners() {
    // 返回按鈕 - 修正返回路徑
    document.getElementById("backButton").addEventListener("click", () => {
        if (daoAddress) {
            // 使用正確的返回路徑
            window.location.href = `/dao/dao-details.html?address=${daoAddress}`;
        } else {
            // 如果沒有地址，嘗試從當前URL重新獲取
            const currentDaoAddress = getDaoAddressFromCurrentUrl();
            if (currentDaoAddress) {
                window.location.href = `/dao/dao-details.html?address=${currentDaoAddress}`;
            } else {
                window.history.back();
            }
        }
    });
}

    function showError(message) {
        const container = document.getElementById("historyContainer");
        container.innerHTML = `
            <div class="error">
                <h3>錯誤</h3>
                <p>${message}</p>
                <div style="margin-top: 15px;">
                    <button onclick="location.reload()" class="btn" style="background: #007bff; color: white;">重新載入頁面</button>
                    <button onclick="window.history.back()" class="btn btn-secondary" style="margin-left: 10px;">返回上頁</button>
                </div>
            </div>
        `;
    }

    // 頁面載入時初始化
    document.addEventListener("DOMContentLoaded", initApp);
</script>
