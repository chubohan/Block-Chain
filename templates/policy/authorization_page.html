async function loadContract() {
    try {
        if (!window.ethereum) {
            alert("請先安裝 MetaMask");
            return;
        }

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = await provider.getSigner();
        insuranceContract = new ethers.Contract(contractAddress, contractABI, signer);

        console.log("合約載入完成");
    } catch (err) {
        console.error("合約初始化錯誤", err);
        alert("合約初始化失敗，請稍候或重新整理");
    }
}
    
    const policyNumber = "{{ policy_number }}";
    console.log("保單編號", policyNumber);
    const clientGmail = "{{ current_user.id }}";

    async function addAuthorization() {
    
    const gmail = document.getElementById('authorizedGmail').value.trim();
    const walletInput = document.getElementById('authorizedWallet').value.trim();
    const relationship = document.getElementById('relationship').value.trim();

    if (!policyNumber || !relationship) {
        alert("請填寫保單編號與關係");
        return;
    }

    let walletAddress = walletInput;

    if (!walletInput && gmail) {
        try {
            const res = await fetch('/policy/get-wallet-address', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gmail: gmail })
            });
            const result = await res.json();

            if (result.success) {
                walletAddress = result.wallet;
            } else {
                alert("❌ 查無此 Gmail 或對方未註冊錢包");
                return;
            }
        } catch (err) {
            console.error("Gmail 查詢失敗:", err);
            alert("❌ 查詢失敗，請稍後再試");
            return;
        }
    }

    if (!walletAddress || !ethers.utils.isAddress(walletAddress)) {
        alert("請提供有效的錢包地址或可查到錢包的 Gmail");
        return;
    }

    try {
        // 確保合約已載入
        if (!insuranceContract) {
            alert("合約尚未載入，請稍候或重新整理");
            return;
        }

        const policy = await insuranceContract.policies(policyNumber);
        const policyOwner = policy[10];  // 假設 index 10 是 ownerAddress
       const currentAddress = await signer.getAddress();

        if (currentAddress.toLowerCase() !== policyOwner.toLowerCase()) {
            alert("❌ 只有保單擁有者可授權");
            return;
        }

        const tx = await insuranceContract.authorizePolicyAccess(policyNumber, walletAddress);
        await tx.wait();

        const res = await fetch('/policy/add-authorization', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                policy_number: policyNumber,
                authorized_gmail: gmail,
                authorized_wallet: walletAddress,
                relationship: relationship,
                tx_hash: tx.hash
            })
        });

        const result = await res.json();
        if (result.success) {
            alert("✅ 授權成功");
            location.reload();
        } else {
            alert("❌ 資料庫寫入失敗：" + result.message);
        }

    } catch (error) {
        console.error("授權失敗：", error);
        alert("❌ 授權失敗：" + (error.reason || error.message));
    }
}

async function deleteAuthorization(gmail) {
    if (!confirm("確定要刪除此授權嗎？")) return;

    let walletAddress;

    try {
        const res = await fetch('/policy/get-wallet-address', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gmail: gmail })
        });

        const result = await res.json();
        if (!result.success) {
            alert("❌ 查無此 Gmail 對應的錢包地址");
            return;
        }

        walletAddress = result.wallet;
    } catch (err) {
        console.error("取得錢包地址失敗：", err);
        alert("❌ 取得錢包地址失敗，請稍後再試");
        return;
    }

    if (!walletAddress || !ethers.utils.isAddress(walletAddress)) {
        alert("❌ 無效的錢包地址");
        return;
    }

    try {
        const policy = await insuranceContract.policies(policyNumber);
        const policyOwner = policy[10]; // index 10 為 owner address
        const currentAddress = await signer.getAddress();

        if (currentAddress.toLowerCase() !== policyOwner.toLowerCase()) {
            alert("❌ 只有保單擁有者可以刪除授權");
            return;
        }

        const tx = await insuranceContract.revokePolicyAccess(policyNumber, walletAddress);
        await tx.wait();

        const response = await fetch('/policy/delete-authorization', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                policy_number: policyNumber,
                authorized_gmail: gmail,
                authorized_wallet: walletAddress,
                tx_hash: tx.hash
            })
        });

        const dbResult = await response.json();
        if (dbResult.success) {
            alert("✅ 已成功取消授權");
            location.reload();
        } else {
            alert("❌ 後端刪除失敗：" + dbResult.message);
        }

    } catch (err) {
        console.error("取消授權失敗：", err);
        alert("❌ 取消授權失敗：" + (err.reason || err.message));
    }
}
