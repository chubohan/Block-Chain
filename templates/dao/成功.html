{% extends "base.html" %}

{% block title %}DAO 前端測試 - ChainSure{% endblock %}

{% block extra_css %}
<style>
    /* 主要內容區域樣式 */
    .dao-test-container {
        margin-top: 120px;
        width: 90%;
        max-width: 1000px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(74, 110, 224, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 錢包區域 */
    .wallet-section {
        background: linear-gradient(135deg, rgba(74, 110, 224, 0.1), rgba(100, 193, 255, 0.1));
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 30px;
        border: 1px solid rgba(74, 110, 224, 0.2);
    }

    .wallet-info {
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .wallet-address {
        background: rgba(255, 255, 255, 0.8);
        padding: 10px 20px;
        border-radius: 25px;
        color: #2d4fc6;
        font-weight: 600;
        border: 1px solid rgba(74, 110, 224, 0.3);
        font-family: monospace;
    }

    /* 創建 DAO 區域 */
    .create-dao-section {
        background: linear-gradient(135deg, rgba(168, 230, 207, 0.1), rgba(136, 212, 171, 0.1));
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 30px;
        border: 1px solid rgba(136, 212, 171, 0.3);
    }

    .section-title {
        color: #2d4fc6;
        font-weight: bold;
        margin-bottom: 20px;
        font-size: 1.4rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .input-group {
        display: flex;
        gap: 15px;
        align-items: flex-end;
        flex-wrap: wrap;
    }

    .form-input {
        flex: 1;
        min-width: 200px;
        padding: 12px 15px;
        border: 1px solid rgba(74, 110, 224, 0.3);
        border-radius: 8px;
        background: white;
        transition: all 0.3s ease;
        font-size: 1rem;
    }

    .form-input:focus {
        outline: none;
        border-color: #4a6ee0;
        box-shadow: 0 0 0 3px rgba(74, 110, 224, 0.1);
    }

    /* DAO 列表區域 */
    .dao-list-section {
        background: linear-gradient(135deg, rgba(255, 210, 139, 0.1), rgba(255, 179, 71, 0.1));
        border-radius: 15px;
        padding: 25px;
        border: 1px solid rgba(255, 179, 71, 0.3);
    }

    .dao-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
    }

    .dao-item {
        background: linear-gradient(135deg, #ffffff, #f8faff);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid rgba(74, 110, 224, 0.15);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .dao-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(135deg, #4a6ee0, #64c1ff);
    }

    .dao-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(74, 110, 224, 0.15);
    }

    .dao-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .dao-title {
        color: #2d4fc6;
        font-weight: bold;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dao-address {
        color: #666;
        font-size: 0.85rem;
        font-family: monospace;
        background: rgba(74, 110, 224, 0.05);
        padding: 6px 10px;
        border-radius: 6px;
        word-break: break-all;
    }

    /* 按鈕樣式 */
    .btn-connect {
        background: linear-gradient(135deg, #4a6ee0, #64c1ff);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-connect:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(100, 193, 255, 0.3);
        color: white;
    }

    .btn-create {
        background: linear-gradient(135deg, #a8e6cf, #88d4ab);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-create:hover {
        background: linear-gradient(135deg, #88d4ab, #6bc49c);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(136, 212, 171, 0.3);
        color: white;
    }

    .btn-info {
        background: linear-gradient(135deg, #ffd28b, #ffb347);
        color: #333;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9rem;
    }

    .btn-info:hover {
        background: linear-gradient(135deg, #ffb347, #ff9a02);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 179, 71, 0.3);
        color: #333;
    }

    /* 載入和空狀態 */
    .loading-state {
        text-align: center;
        padding: 40px 20px;
        color: #666;
    }

    .loading-state i {
        font-size: 2.5rem;
        color: #64c1ff;
        margin-bottom: 15px;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #666;
    }

    .empty-state i {
        font-size: 2.5rem;
        color: #ffd28b;
        margin-bottom: 15px;
    }

    .empty-state h3 {
        color: #2d4fc6;
        margin-bottom: 10px;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .dao-test-container {
            margin-top: 100px;
            width: 95%;
            padding: 25px;
        }

        .wallet-info {
            flex-direction: column;
            align-items: flex-start;
        }

        .input-group {
            flex-direction: column;
            align-items: stretch;
        }

        .form-input {
            min-width: auto;
        }

        .dao-header {
            flex-direction: column;
            align-items: flex-start;
        }
    }

    @media (max-width: 576px) {
        .dao-test-container {
            padding: 20px;
        }

        .wallet-section,
        .create-dao-section,
        .dao-list-section {
            padding: 20px;
        }

        .dao-item {
            padding: 15px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="dao-test-container">
    <!-- 錢包區域 -->
    <div class="wallet-section">
        <h2 class="section-title">
            <i class="fas fa-wallet"></i>DAO 前端測試
        </h2>
        <div class="wallet-info">
            <button id="connectWallet" class="btn-connect">
                <i class="fas fa-plug"></i>連接錢包
            </button>
            <span id="walletAddress" class="wallet-address">尚未連接</span>
        </div>
    </div>

    <!-- 創建 DAO 區域 -->
    <div class="create-dao-section">
        <h3 class="section-title">
            <i class="fas fa-plus-circle"></i>創建新 DAO
        </h3>
        <div class="input-group">
            <input type="text" id="monthlyPremium" class="form-input" placeholder="輸入月保費 (ETH)">
            <button id="createDAO" class="btn-create">
                <i class="fas fa-rocket"></i>創建 DAO
            </button>
        </div>
    </div>

    <!-- DAO 列表區域 -->
    <div class="dao-list-section">
        <h3 class="section-title">
            <i class="fas fa-list"></i>DAO 列表
        </h3>
        <div id="daoList" class="dao-list">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>請先連接錢包</h3>
                <p>連接錢包後將顯示 DAO 列表</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 所有原有的 JavaScript 代碼保持完全一樣
    let provider;
    let signer;
    let walletAddress;

    // TODO: 填入你的 Factory 合約地址
    const factoryAddress = "0x5FbDB2315678afecb367f032d93F642f64180aa3";

    // TODO: 填入你的 Factory ABI
    const factoryABI = [
        {
            "anonymous": false,
            "inputs": [
                {
                    "indexed": false,
                    "internalType": "address",
                    "name": "daoAddress",
                    "type": "address"
                },
                {
                    "indexed": false,
                    "internalType": "uint256",
                    "name": "monthlyPremium",
                    "type": "uint256"
                }
            ],
            "name": "DAOCreated",
            "type": "event"
        },
        {
            "inputs": [
                {
                    "internalType": "uint256",
                    "name": "_monthlyPremium",
                    "type": "uint256"
                }
            ],
            "name": "createDAO",
            "outputs": [],
            "stateMutability": "nonpayable",
            "type": "function"
        },
        {
            "inputs": [
                {
                    "internalType": "uint256",
                    "name": "",
                    "type": "uint256"
                }
            ],
            "name": "daoAddresses",
            "outputs": [
                {
                    "internalType": "address",
                    "name": "",
                    "type": "address"
                }
            ],
            "stateMutability": "view",
            "type": "function"
        },
        {
            "inputs": [],
            "name": "getDAOAddresses",
            "outputs": [
                {
                    "internalType": "address[]",
                    "name": "",
                    "type": "address[]"
                }
            ],
            "stateMutability": "view",
            "type": "function"
        }
    ];

    // TODO: 填入 DAO ABI（最小化，只需 monthlyPremium）
    const daoABI = [
        // ... 您原有的完整 daoABI 保持不變
    ];

    let factoryContract;

    async function connectWallet() {
        if (window.ethereum) {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            walletAddress = await signer.getAddress();
            document.getElementById("walletAddress").innerText = walletAddress;
            factoryContract = new ethers.Contract(factoryAddress, factoryABI, provider); // 用 provider
            console.log("Wallet connected:", walletAddress);
            console.log("Factory address:", factoryContract.address);
            loadDAOAddresses(); // 連接錢包後立即讀取 DAO 列表
        } else {
            alert("請安裝 MetaMask");
        }
    }

    async function createDAO() {
        const premiumInput = document.getElementById("monthlyPremium").value;
        if (!premiumInput) {
            alert("請輸入月保費");
            return;
        }
        const premiumWei = ethers.utils.parseEther(premiumInput);
        try {
            const factoryWithSigner = factoryContract.connect(signer); // 發交易需要 signer
            const tx = await factoryWithSigner.createDAO(premiumWei);
            console.log("創建 DAO 交易發送中...", tx.hash);
            await tx.wait(); // 等待交易被礦工打包
            console.log("DAO 已創建，更新列表...");
            loadDAOAddresses();
        } catch (err) {
            console.error("創建 DAO 發生錯誤:", err);
        }
    }

    async function loadDAOAddresses() {
        try {
            const daoAddresses = await factoryContract.getDAOAddresses();
            console.log("DAO addresses:", daoAddresses);

            const daoListDiv = document.getElementById("daoList");
            daoListDiv.innerHTML = ""; // 清空

            if (daoAddresses.length === 0) {
                daoListDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-landmark"></i>
                        <h3>尚未創建任何 DAO</h3>
                        <p>使用上方表單創建第一個 DAO</p>
                    </div>
                `;
                return;
            }

            daoAddresses.forEach(async (addr, index) => {
                const daoItem = document.createElement("div");
                daoItem.className = "dao-item";
                daoItem.innerHTML = `
                    <div class="dao-header">
                        <div class="dao-title">
                            <i class="fas fa-landmark"></i>DAO ${index + 1}
                        </div>
                        <div class="dao-address">${addr}</div>
                    </div>
                    <button class="btn-info" onclick="showDAODetails('${addr}', ${index})">
                        <i class="fas fa-info-circle"></i>詳細資訊
                    </button>
                `;
                daoListDiv.appendChild(daoItem);
            });
        } catch (err) {
            console.error("讀取 DAO addresses 錯誤:", err);
            const daoListDiv = document.getElementById("daoList");
            daoListDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>載入失敗</h3>
                    <p>無法載入 DAO 列表，請確認網絡連接</p>
                </div>
            `;
        }
    }

    async function showDAODetails(addr, index) {
        try {
            const daoContract = new ethers.Contract(addr, daoABI, provider);
            const monthlyPremiumWei = await daoContract.getMonthlyPremium();
            const monthlyPremium = ethers.utils.formatEther(monthlyPremiumWei);
            const memberCount = await daoContract.getMemberCount();
            const totalClaims = await daoContract.getTotalClaims();

            let paidTotal = 0;
            if (walletAddress) {
                try {
                    paidTotal = await daoContract.memberPaidTotal(walletAddress);
                    paidTotal = ethers.utils.formatEther(paidTotal);
                } catch (err) {
                    console.warn("無法取得使用者已繳總額", err);
                }
            }

            alert(
                `DAO ${index + 1} 詳細資訊：\n\n月保費: ${monthlyPremium} ETH\n成員數: ${memberCount}\n總理賠數: ${totalClaims}\n你已繳總額: ${paidTotal} ETH`
            );
        } catch (err) {
            console.error("取得 DAO 詳細資訊失敗:", err);
            alert("無法取得 DAO 詳細資訊，請稍後再試");
        }
    }

    // 事件監聽器
    document.getElementById("connectWallet").addEventListener("click", connectWallet);
    document.getElementById("createDAO").addEventListener("click", createDAO);
</script>
{% endblock %}
