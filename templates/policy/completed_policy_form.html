{% extends "base.html" %}

{% block title %}保單詳細資料 - ChainSure{% endblock %}

{% block extra_css %}
<link href="/static/css/create_form.css" rel="stylesheet">
<style>
    .policy-detail-container {
        max-width: 800px;
        margin: 80px auto 40px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
    }

    .policy-detail-container h2 {
        color: #4a6ee0;
        margin-bottom: 30px;
        font-size: 2.5rem;
        font-weight: bold;
        text-align: center;
        background: linear-gradient(135deg, #4a6ee0, #64c1ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .form-wrapper {
        margin-top: 30px;
    }

    .form-wrapper label {
        font-weight: bold;
        color: #555;
        margin-bottom: 8px;
        display: block;
    }

    .form-wrapper input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #f8f9fa;
        box-sizing: border-box;
        color: #666;
        margin-bottom: 20px;
    }

    .form-wrapper input:read-only {
        background: #f8f9fa;
        color: #666;
        cursor: not-allowed;
    }

    .divider {
        height: 2px;
        background: linear-gradient(90deg, transparent, #64c1ff, transparent);
        margin: 30px 0;
    }

    .upload-section {
        text-align: center;
        margin: 20px 0;
        padding: 20px;
        background: rgba(248, 249, 250, 0.8);
        border-radius: 10px;
        border: 1px solid #e0e0e0;
    }

    .upload-section a {
        color: #4a6ee0;
        text-decoration: none;
        font-weight: bold;
    }

    .upload-section a:hover {
        color: #64c1ff;
        text-decoration: underline;
    }

    .form-footer {
        margin-top: 30px;
        text-align: center;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .policy-detail-container {
            margin: 60px 20px 20px;
            padding: 30px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="policy-detail-container">
    <h2>保單詳細資料</h2>

    <div class="form-wrapper">
        <form id="policyForm">
            <label>
                客戶 Gmail
                <input type="email" id="clientGmail" value="{{ policy.client_gmail }}" readonly />
            </label> 
            <label>
                保險員 Gmail
                <input type="email" id="officerGmail" value="{{ policy.officer_gmail }}" readonly />
            </label> 
            <label>
                保單編號
                <input type="text" id="policyNumber" value="{{ policy.policy_id }}" readonly />
            </label>

            <label>
                保險公司名稱
                <input type="text" id="insuranceCompany" value="{{ policy.company }}" readonly />
            </label>

            <label>
                投保人姓名
                <input type="text" id="policyHolder" value="{{ policy.policyHolder }}" readonly />
            </label>

            <label>
                被保險人姓名
                <input type="text" id="insuredPerson" value="{{ policy.insuredPerson }}" readonly />
            </label>

            <label>
                保險金額 (NTD)
                <input type="number" id="insuranceAmount" value="{{ policy.insuranceAmount }}" readonly />
            </label>

            <label>
                繳費期間 (年)
                <input type="number" id="premiumPeriod" value="{{ policy.premiumPeriod }}" readonly />
            </label>

            <label>
                保費金額 (NTD)
                <input type="number" id="premiumAmount" value="{{ policy.premiumAmount }}" readonly />
            </label>

            <label>
                生效日期
                <input type="text" id="startDate" value="{{ policy.startDate }}" readonly />
            </label>

            <label>
                受益人
                <input type="text" id="beneficiary" value="{{ policy.beneficiary }}" readonly />
            </label>

            <label>
                增額比例 (%)
                <input type="number" id="growthRate" value="{{ policy.growthRate }}" readonly />
            </label>

            <label>
                宣告利率 (%)
                <input type="number" id="declaredInterestRate" value="{{ policy.declaredInterestRate }}" readonly />
            </label>

            <div class="divider"></div>

            <div class="upload-section">
                <label>
                    已上傳 PDF 文件：
                    {% if policy.pdf_hash %}
                        <a href="https://ipfs.io/ipfs/{{ policy.pdf_hash }}" target="_blank">查看 PDF</a>
                    {% else %}
                        無文件
                    {% endif %}
                </label>
            </div>

            <div class="form-footer">
                <div id="status"></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script>
    async function submitPolicy() {
        const formData = new FormData();

        formData.append('clientGmail', document.getElementById('clientGmail').value.trim());
        formData.append('policyNumber', document.getElementById('policyNumber').value.trim());
        formData.append('insuranceCompany', document.getElementById('insuranceCompany').value.trim());
        formData.append('policyHolder', document.getElementById('policyHolder').value.trim());
        formData.append('insuredPerson', document.getElementById('insuredPerson').value.trim());
        formData.append('insuranceAmount', document.getElementById('insuranceAmount').value.trim());
        formData.append('premiumPeriod', document.getElementById('premiumPeriod').value.trim());
        formData.append('premiumAmount', document.getElementById('premiumAmount').value.trim());
        formData.append('startDate', document.getElementById('startDate').value.trim());
        formData.append('beneficiary', document.getElementById('beneficiary').value.trim());
        formData.append('growthRate', document.getElementById('growthRate').value.trim());
        formData.append('declaredInterestRate', document.getElementById('declaredInterestRate').value.trim());
        formData.append('pdfUpload', document.getElementById('pdfUpload').files[0]);

        try {
            const response = await fetch('/officer/upload-policy', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });

            const result = await response.json();

            if (result.success) {
                alert('保單已暫存並發送簡訊');
                window.location.href = '/officer/client-page';
            } else {
                alert('操作失敗：' + result.message);
            }
        } catch (error) {
            console.error(error);
            alert('伺服器錯誤：' + error.message);
        }
    }
</script>
{% endblock %}
