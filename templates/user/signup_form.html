{% extends "base.html" %}

{% block title %}註冊帳號 - ChainSure{% endblock %}

{% block extra_css %}
<link href="/static/css/signup.css" rel="stylesheet">
<style>
    .register-box {
        max-width: 500px;
        margin: 40px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .register-box h2 {
        color: #4a6ee0;
        margin-bottom: 30px;
        font-size: 28px;
        font-weight: bold;
    }

    .form {
        text-align: left;
    }

    .input-field {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: white;
        color: #999; /* placeholder-like color when empty */
        box-sizing: border-box;
    }

    .input-field.has-value {
        color: #000; /* 使用者輸入後的顏色 */
    }

    /* 打字中（focus 且有值）變白色 */
    .input-field.has-value:focus {
        color: #fff;
    }

    .input-field:focus {
        outline: none;
        border-color: #64c1ff;
        box-shadow: 0 0 0 3px rgba(100, 193, 255, 0.1);
    }

    .input-field::placeholder {
        color: #999;
    }

    select.input-field {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'><path fill='%23666' d='M2 0L0 2h4zm0 5L0 3h4z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 12px;
        padding-right: 40px;
    }

     /* 預設顯示灰色 (未選擇時) */
    select.input-field:invalid {
        color: #999;
    }
    select.input-field:valid {
        color: #000;
    }

    /* 選擇後變黑色 */
    select.input-field option {
        color: #fff;
    }

    select.input-field option[disabled] {
        color: #999;
}

    .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #8ac6ff, #64c1ff);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(100, 193, 255, 0.3);
    }

    .submit-btn:hover {
        background: linear-gradient(135deg, #64c1ff, #4a6ee0);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(74, 110, 224, 0.4);
    }
    
    #walletAddress {
    color: #4c556c;
    font-weight: 500;
    word-break: break-all;
    }

    #walletAddress.connected {
        color: #4c556c;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .register-box {
            margin: 20px;
            padding: 30px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="register-box">
    <h2>註冊帳號</h2>
    <form action="/user/signup" method="post">
        <div class="form">
            <input type="text" name="username" class="input-field" placeholder="姓名" required>
            <input type="number" name="age" class="input-field" placeholder="年齡" required>
            <select id="gender" name="gender" class="input-field" required>
                <option value="" disabled selected hidden>請選擇</option>
                <option value="male">男</option>
                <option value="female">女</option>
            </select>
            <input type="email" name="gmail" class="input-field" placeholder="Gmail" required>
            <input type="password" name="password1" class="input-field" placeholder="密碼" required>
            <input type="password" name="password2" class="input-field" placeholder="確認密碼" required>

            <!-- 新增身份選擇 -->
            <select id="role" name="insurance_officer" class="input-field" required>
                <option value="" disabled selected hidden>選擇身分</option>
                <option value="0">一般用戶</option>
                <option value="1">管理員</option>
            </select>
            
            <div class="text-center">
            <button id="connectBtn" type="button" class="btn btn-warning" onclick="connectWallet()">連接錢包</button>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; height: 50px; padding: 0 10px; border-radius: 5px;">
                <span id="walletAddress" name="wallet">尚未連接</span>
            </div>

            <input type="hidden" name="wallet" id="walletInput">

            <button type="submit" class="submit-btn">註冊</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
        // 全域宣告 (必須!)
        let web3 = null;
        let account = null; // 明確初始化為 null
        // 合約地址和 ABI（需與後端一致）

        async function connectWallet() {
        try {
            if (!window.ethereum) throw new Error("請先安裝 MetaMask");

            web3 = new Web3(window.ethereum);
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            account = accounts[0];

            // 顯示在畫面上
            const addressSpan = document.getElementById('walletAddress');
            addressSpan.textContent = account;
            addressSpan.style.color = '#4c556c'; // 黑色文字
            addressSpan.classList.add('connected');

            // 存進 hidden input，表單送出時一併送到後端
            document.getElementById('walletInput').value = account;

            alert("錢包連接成功：" + account);
        } catch (error) {
            alert("連線失敗：" + error.message);
        }
    }</script>

<script src="/static/js/signup.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
    const fields = document.querySelectorAll('.input-field');

    function checkAndToggle(el) {
      let hasValue = false;
      if (el.tagName.toLowerCase() === 'select') {
        hasValue = el.value !== '' && el.value !== null;
      } else {
        const v = (el.value || '').toString().trim();
        hasValue = v.length > 0;
      }

      if (hasValue) {
        el.classList.add('has-value');
      } else {
        el.classList.remove('has-value');
      }
    }

    fields.forEach(function (el) {
      checkAndToggle(el);
      el.addEventListener('input', () => checkAndToggle(el));
      el.addEventListener('blur', () => checkAndToggle(el));
      if (el.tagName.toLowerCase() === 'select') {
        el.addEventListener('change', () => checkAndToggle(el));
      }
    });

    const forms = document.querySelectorAll('form');
    forms.forEach(function (form) {
      form.addEventListener('reset', function () {
        setTimeout(() => {
          fields.forEach((el) => el.classList.remove('has-value'));
        }, 0);
      });
    });
  });
    // 表單驗證增強
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const password1 = document.querySelector('input[name="password1"]');
        const password2 = document.querySelector('input[name="password2"]');

        // 密碼確認驗證
        function validatePasswords() {
            if (password1.value !== password2.value) {
                password2.setCustomValidity('密碼不一致');
                password2.style.borderColor = '#ff6b6b';
            } else {
                password2.setCustomValidity('');
                password2.style.borderColor = '#64c1ff';
            }
        }

        password1.addEventListener('input', validatePasswords);
        password2.addEventListener('input', validatePasswords);

        // 年齡驗證
        const ageInput = document.querySelector('input[name="age"]');
        ageInput.addEventListener('input', function() {
            if (this.value < 0) {
                this.value = 0;
            }
            if (this.value > 120) {
                this.setCustomValidity('請輸入有效的年齡');
            } else {
                this.setCustomValidity('');
            }
        });

        // 表單提交前的最終驗證
        form.addEventListener('submit', function(e) {
            validatePasswords();
            
            if (!form.checkValidity()) {
                e.preventDefault();
                // 可以添加錯誤提示
            }
        });
    });
</script>
{% endblock %}
