<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>補全資料</title>
    <style>
        /* 星空背景效果 */
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #1a1a2e;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    flex-direction: column;
}

/* 星空背景圖片層 */
.stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://cdn.pixabay.com/photo/2017/08/30/02/18/starry-night-2695563_960_720.jpg') no-repeat center center fixed;
    background-size: cover;
    z-index: -10;
    pointer-events: none;
}

/* 小星星動畫（隨機生成星點） */
.star {
    position: absolute;
    border-radius: 50%;
    width: 2px;
    height: 2px;
    background-color: white;
    animation: twinkle 1.5s infinite alternate;
}

@keyframes twinkle {
    0% {
        opacity: 0.6;
        transform: scale(1);
    }
    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}


        /* 中央卡片 */
        .form-container {
            max-width: 500px;
            margin: 100px auto;
            background-color: #111;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.5);
            padding: 30px;
        }

        /* 發光標題 */
        .form-container h1 {
            text-align: center;
            font-size: 32px;
            color: #FFA500;
            text-shadow: 0 0 10px #FFA500, 0 0 20px #ff8c00;
            margin-bottom: 30px;
        }

        /* 表單欄位 */
        .form-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-container input,
        .form-container select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 16px;
        }

        /* 提交按鈕 */
        .form-container button {
            width: 100%;
            padding: 12px;
            background-color: #FFA500;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #FFA500;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>請補全您的資料</h1>
        <form id="profileForm">
            <div>
                <label>年齡:</label>
                <input type="number" name="age" min="18" max="120" required>
            </div>
            <div>
                <label>性別:</label>
                <select name="gender" required>
                    <option value="">請選擇</option>
                    <option value="male">男性</option>
                    <option value="female">女性</option>
                </select>
            </div>
            <button type="submit">提交</button>
        </form>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                age: e.target.age.value,
                gender: e.target.gender.value
            };

            try {
                const response = await fetch('/user/complete-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    alert('錯誤: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('提交失敗，請重試');
            }
        });
    </script>
    <script>        const starContainer = document.querySelector('.stars');

        // 產生閃爍小星星
        const starCount = 150;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.animationDuration = `${1 + Math.random() * 3}s`;
            star.style.opacity = Math.random();
            starContainer.appendChild(star);
        }

        // 定時產生流星
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.top = `${Math.random() * 30 + 10}vh`; // 頂部範圍
            star.style.left = `${Math.random() * 100}vw`;
            starContainer.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 1000);
        }

        setInterval(createShootingStar, 3000);

        const starsContainer = document.querySelector('.stars');

  // 生成流星
  function createShootingStar() {
    const shootingStar = document.createElement('div');
    shootingStar.classList.add('shooting-star');
    shootingStar.style.top = `${Math.random()*50}vh`;
    shootingStar.style.left = `${Math.random()*80}vw`;
    starsContainer.appendChild(shootingStar);

    shootingStar.addEventListener('animationend', () => {
      shootingStar.remove();
    });
  }

  // 每3-6秒生成一顆流星
  setInterval(() => {
    createShootingStar();
  }, 3000 + Math.random()*3000);</script>
</body>
</html>
