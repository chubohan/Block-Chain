<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>ChainSure 保單健檢視覺化</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #1a1a2e;
      color: #fff;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
      text-shadow: 1px 1px 5px #ffcc00;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }

    /* Navbar 基本樣式 */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      z-index: 1000;
      backdrop-filter: blur(6px);
    }

    .navbar-brand {
      font-size: 28px;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .navbar-nav {
      display: flex;
      gap: 30px;
    }

    .nav-link {
      color: white;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s;
    }

    .nav-link:hover {
      color: #ff6347;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="#">ChainSure</a>
    <div class="navbar-nav">
      <a class="nav-link" href="#">客戶服務</a>
      <a class="nav-link" href="#">保單服務</a>
      <a class="nav-link" href="#">理賠服務</a>
      <a class="nav-link" href="#">熱門活動</a>
      <a class="nav-link" href="#">登入</a>
    </div>
  </nav>

  <div class="container">
    <h2>保單健檢雷達圖分析</h2>
    <canvas id="radarChart" width="400" height="400"></canvas>
  </div>

  <script>
    const ctx = document.getElementById('radarChart').getContext('2d');
    const radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['保障完整性', '保費合理性', '理賠便利性', '資訊透明度', '家人可用性'],
        datasets: [{
          label: '使用者評分',
          data: [80, 70, 85, 75, 90],
          backgroundColor: 'rgba(255, 206, 86, 0.3)',
          borderColor: '#ffcc00',
          borderWidth: 2,
          pointBackgroundColor: '#ffcc00',
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#ffcc00',
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            angleLines: { color: '#444' },
            grid: { color: '#666' },
            pointLabels: {
              color: 'white',
              font: { size: 14 }
            },
            suggestedMin: 0,
            suggestedMax: 100,
            ticks: {
              backdropColor: 'transparent',
              color: '#ccc',
              stepSize: 20,
              showLabelBackdrop: false,
            }
          }
        },
        plugins: {
          tooltip: {
            enabled: true,
            callbacks: {
              label: function(context) {
                return `${context.label}：${context.formattedValue} 分`;
              }
            }
          },
          legend: {
            labels: {
              color: 'white'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
