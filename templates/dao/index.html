{% extends "base.html" %}

{% block title %}提案投票{% endblock %}

{% block extra_css %}
<style>
    /* DAO 平台專用樣式 */
    .header {
        text-align: center;
        margin-bottom: 40px;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
    }

    .header h1 {
        color: #2d4fc6;
        font-size: 3rem;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .header p {
        color: #666;
        font-size: 1.2rem;
        max-width: 600px;
        margin: 0 auto;
    }

    /* Wallet Section */
    .wallet-section {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
    }

    .wallet-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 15px 0;
        padding: 15px;
        background: white;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
    }

    .wallet-label {
        font-weight: bold;
        color: #000000;
        min-width: 120px;
    }

    .wallet-address {
        font-family: 'Courier New', monospace;
        background: #f8f9fa;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        flex-grow: 1;
        margin: 0 15px;
        word-break: break-all;
        color: #000000;
    }

    .wallet-status {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        min-width: 80px;
        text-align: center;
    }

    .status-connected {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .status-not-set {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
    }

    .status-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }

    .btn-refresh {
        background: linear-gradient(135deg, #6c757d, #5a6268);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        margin: 0 auto;
    }

    .btn-refresh:hover {
        background: linear-gradient(135deg, #5a6268, #495057);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
    }

    .wallet-tips {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #000000;
        background: rgba(255, 255, 255, 0.7);
        padding: 10px;
        border-radius: 8px;
    }

    /* Button Styles */
    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
    }

    .btn-create {
        background: linear-gradient(135deg, #28a745, #20c997);
        color: white;
    }

    .btn-create:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    .btn-view {
        background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        color: white;
    }

    .btn-view:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }

    /* Form Styles */
    .form-section {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        margin-bottom: 40px;
    }

    .form-section h2 {
        color: #2d4fc6;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2.2rem;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        margin-bottom: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full-width {
        grid-column: 1 / -1;
    }

    .form-label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #000000;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-input, .form-textarea, .form-file {
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: white;
        color: #000000;
    }

    .form-input:focus, .form-textarea:focus, .form-file:focus {
        outline: none;
        border-color: #4a6ee0;
        box-shadow: 0 0 0 3px rgba(74, 110, 224, 0.1);
    }

    .form-textarea {
        resize: vertical;
        min-height: 120px;
        font-family: inherit;
    }

    .form-file {
        padding: 10px;
    }

    .create-btn-container {
        text-align: center;
        margin-top: 20px;
    }

    /* DAO List Styles */
    .dao-section {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .dao-section h2 {
        color: #2d4fc6;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2.2rem;
    }

    .dao-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
    }

    .dao-card {
        background: white;
        border: 1px solid rgba(74, 110, 224, 0.1);
        border-radius: 15px;
        padding: 25px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
    }

    .dao-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(135deg, #4a6ee0, #64c1ff);
    }

    .dao-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .dao-card h3 {
        color: #2d4fc6;
        margin-bottom: 15px;
        font-size: 1.4rem;
    }

    .dao-address {
        font-family: 'Courier New', monospace;
        color: #666;
        font-size: 0.9rem;
        word-break: break-all;
        margin-bottom: 20px;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
    }

    .dao-actions {
        display: flex;
        gap: 10px;
    }

    .btn-details {
        background: linear-gradient(135deg, #6c757d, #868e96);
        color: white;
        padding: 8px 16px;
        font-size: 0.9rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
        
        .header h1 {
            font-size: 2.2rem;
        }
        
        .wallet-info {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .wallet-address {
            margin: 10px 0;
            width: 100%;
        }
        
        .dao-grid {
            grid-template-columns: 1fr;
        }
    }

    /* Loading Animation */
    .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #4a6ee0;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Status Messages */
    .status-message {
        padding: 15px;
        border-radius: 10px;
        margin: 10px 0;
        text-align: center;
        font-weight: 600;
        color: #000000;
    }

    .status-success {
        background: rgba(40, 167, 69, 0.1);
        color: #28a745;
        border: 1px solid #28a745;
    }

    .status-error {
        background: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        border: 1px solid #dc3545;
    }

    /* File Upload Styling */
    .file-upload-container {
        position: relative;
        display: inline-block;
        width: 100%;
    }

    .file-upload-label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: white;
        border: 2px dashed #4a6ee0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #4a6ee0;
        font-weight: 600;
    }

    .file-upload-label:hover {
        background: rgba(74, 110, 224, 0.05);
    }

    .file-upload-input {
        position: absolute;
        left: -9999px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-vote-yea"></i>提案投票</h1>
        <p>去中心化保險治理 - 共同管理理賠決策</p>
    </div>

    <!-- Wallet Section -->
    <div class="wallet-section">
        <h3><i class="fas fa-wallet"></i> 錢包資訊</h3>
        <button type="button" class="btn-refresh" onclick="loadWalletAddress()">
            <i class="fas fa-redo"></i> 重新載入錢包地址
        </button>
        
        <div class="wallet-info">
            <span class="wallet-label">您的錢包地址:</span>
            <span class="wallet-address" id="userWalletAddress">載入中...</span>
            <span class="wallet-status status-connected" id="userWalletStatus">已連接</span>
        </div>

        <div class="wallet-tips">
            <i class="fas fa-lightbulb"></i> 錢包地址自動載入，請確保 MetaMask 與註冊時相同地址
        </div>
    </div>

    <!-- Create DAO Section -->
    <div class="form-section">
        <h2><i class="fas fa-plus-circle"></i> 新增保險計畫</h2>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-signature"></i> 提案名稱
                </label>
                <input type="text" id="daoName" class="form-input" placeholder="例如：汽車保險">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-coins"></i> 月保費 (ETH)
                </label>
                <input type="text" id="monthlyPremium" class="form-input" placeholder="例如：0.01">
            </div>

            <div class="form-group full-width">
                <label class="form-label">
                    <i class="fas fa-file-alt"></i> 理賠內容
                </label>
                <textarea id="claimDescription" class="form-textarea" placeholder="請詳細描述理賠內容、條件和規則..."></textarea>
            </div>

            <div class="form-group full-width">
                <label class="form-label">
                    <i class="fas fa-file-pdf"></i> 上傳 PDF 申請表
                </label>
                <div class="file-upload-container">
                    <label for="pdfFile" class="file-upload-label">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="fileLabel">選擇 PDF 檔案</span>
                    </label>
                    <input type="file" id="pdfFile" class="file-upload-input" accept="application/pdf">
                </div>
            </div>
        </div>

        <div class="create-btn-container">
            <button id="createDaoBtn" class="btn btn-create">
                <i class="fas fa-rocket"></i> 發起提案
            </button>
        </div>
    </div>

    <!-- DAO List Section -->
    <div class="dao-section">
        <h2><i class="fas fa-list"></i> 所有提案列表</h2>
        <div id="daoList" class="dao-grid">
            <!-- DAO cards will be dynamically inserted here -->
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    let provider;
    let signer;
    let factoryContract;
    let userWalletAddress = null;

    const factoryAbi = [
        "function createDAO(string memory daoName, uint256 monthlyPremium, string memory claimDesc, string memory pdfHash) public",
        "function getDAOAddresses() public view returns(address[])",
        "function daoAddresses(uint256) public view returns(address)"
    ];
    const factoryAddress = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";

    // 格式化錢包地址顯示 (前6位...後4位)
    function formatWalletAddress(address) {
        if (!address) return '';
        if (address.length <= 12) return address;
        return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
    }

    // 頁面載入時自動獲取錢包地址
    document.addEventListener('DOMContentLoaded', function() {
        // 延遲載入錢包地址，確保頁面完全載入
        setTimeout(() => {
            loadWalletAddress();
        }, 500);
    });

    // 載入錢包地址
    async function loadWalletAddress() {
        try {
            console.log('開始載入錢包地址...');
            
            // 顯示載入狀態
            document.getElementById('userWalletAddress').textContent = '載入中...';
            document.getElementById('userWalletStatus').textContent = '載入中';

            // 使用保單系統的路由 - 保持原有後端邏輯
            const response = await fetch('/policy/get_wallet_addresses');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            console.log('錢包地址回應:', data);

            if (data.success && data.user_wallet) {
                userWalletAddress = data.user_wallet;
                document.getElementById('userWalletAddress').textContent = formatWalletAddress(data.user_wallet);
                document.getElementById('userWalletStatus').textContent = '已連接';
                document.getElementById('userWalletStatus').className = 'wallet-status status-connected';
                console.log('用戶錢包地址載入成功:', data.user_wallet);
                
                // 自動初始化 Web3 和載入 DAO
                await initWeb3AndContract();
                await loadDAOs();
            } else {
                throw new Error(data.error || '用戶錢包地址未設定');
            }
        } catch (error) {
            console.error('載入錢包地址失敗:', error);
            document.getElementById('userWalletAddress').textContent = '載入失敗';
            document.getElementById('userWalletStatus').textContent = '錯誤';
            document.getElementById('userWalletStatus').className = 'wallet-status status-error';
            
            let errorMsg = '載入錢包地址失敗: ';
            if (error.message.includes('HTTP error')) {
                errorMsg += '後端服務暫時無法訪問，請稍後再試';
            } else {
                errorMsg += error.message;
            }
            
            console.error(errorMsg);
        }
    }

    // 初始化 Web3 和合約
    async function initWeb3AndContract() {
        if (!userWalletAddress) {
            throw new Error('用戶錢包地址未設定，請先載入錢包地址或聯繫管理員');
        }

        try {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                
                // 檢查當前連接的帳戶是否與資料庫中的一致
                const accounts = await window.ethereum.request({ 
                    method: "eth_requestAccounts" 
                });
                
                const currentAccount = accounts[0];
                if (currentAccount.toLowerCase() !== userWalletAddress.toLowerCase()) {
                    throw new Error(`當前連接的錢包地址 (${formatWalletAddress(currentAccount)}) 與資料庫中的地址 (${formatWalletAddress(userWalletAddress)}) 不一致，請切換到正確的錢包`);
                }
                
                signer = provider.getSigner();
                factoryContract = new ethers.Contract(factoryAddress, factoryAbi, signer);
                console.log('Web3 和合約初始化成功');
                return true;
            } else {
                throw new Error('請安裝 MetaMask 錢包擴展');
            }
        } catch (error) {
            console.error('初始化 Web3 失敗:', error);
            throw error;
        }
    }

    // File upload handling
    document.getElementById('pdfFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const fileLabel = document.getElementById('fileLabel');
        if (file) {
            fileLabel.textContent = file.name;
        } else {
            fileLabel.textContent = '選擇 PDF 檔案';
        }
    });

    async function uploadPDFtoIPFS(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch("http://127.0.0.1:5001/api/v0/add", {
                method: "POST",
                body: formData
            });

            const text = await res.text();
            const match = text.match(/"Hash":"([^"]+)"/);
            return match ? match[1] : null;
        } catch (error) {
            console.error('IPFS upload error:', error);
            return null;
        }
    }

    async function createDAO() {
        const daoName = document.getElementById("daoName").value;
        const premiumInput = document.getElementById("monthlyPremium").value;
        const claimDesc = document.getElementById("claimDescription").value;
        const pdfFile = document.getElementById("pdfFile").files[0];

        if (!daoName || !premiumInput || !claimDesc || !pdfFile) {
            alert("請完整填寫所有欄位並上傳 PDF");
            return;
        }

        try {
            // 檢查錢包狀態
            if (!userWalletAddress) {
                throw new Error('請先載入錢包地址');
            }

            const createBtn = document.getElementById('createDaoBtn');
            createBtn.innerHTML = '<div class="loading"></div> 創建中...';
            createBtn.disabled = true;

            const pdfHash = await uploadPDFtoIPFS(pdfFile);
            if (!pdfHash) {
                alert("PDF 上傳 IPFS 失敗");
                createBtn.innerHTML = '<i class="fas fa-rocket"></i> 創建提案';
                createBtn.disabled = false;
                return;
            }

            const premiumWei = ethers.utils.parseEther(premiumInput);
            
            const tx = await factoryContract.createDAO(daoName, premiumWei, claimDesc, pdfHash);
            await tx.wait();

            createBtn.innerHTML = '<i class="fas fa-check"></i> 創建成功';
            setTimeout(() => {
                createBtn.innerHTML = '<i class="fas fa-rocket"></i> 創建 DAO';
                createBtn.disabled = false;
            }, 2000);

            // Reset form
            document.getElementById("daoName").value = '';
            document.getElementById("monthlyPremium").value = '';
            document.getElementById("claimDescription").value = '';
            document.getElementById("pdfFile").value = '';
            document.getElementById("fileLabel").textContent = '選擇 PDF 檔案';

            await loadDAOs();

        } catch (err) {
            console.error(err);
            alert("創建提案失敗：" + err.message);
            document.getElementById('createDaoBtn').innerHTML = '<i class="fas fa-rocket"></i> 創建提案';
            document.getElementById('createDaoBtn').disabled = false;
        }
    }

    async function loadDAOs() {
        const daoListDiv = document.getElementById("daoList");
        daoListDiv.innerHTML = '<div class="status-message">載入中...</div>';
        
        try {
            if (!factoryContract) {
                throw new Error('合約未初始化，請先載入錢包地址');
            }

            const daos = await factoryContract.getDAOAddresses();
            
            if (daos.length === 0) {
                daoListDiv.innerHTML = '<div class="status-message">尚未創建任何保險計畫</div>';
                return;
            }

            daoListDiv.innerHTML = '';
            
            for (let addr of daos) {
                const daoContract = new ethers.Contract(addr, [
                    "function getDAOName() public view returns(string)"
                ], provider);
                
                let daoName = "未知 DAO";
                try {
                    daoName = await daoContract.getDAOName();
                } catch (err) {
                    console.error("獲取 DAO 名稱失敗:", err);
                }
                
                const div = document.createElement("div");
                div.className = "dao-card";
                div.innerHTML = `
                    <h3><i class="fas fa-users"></i> ${daoName}</h3>
                    <div class="dao-address">${addr}</div>
                    <div class="dao-actions">
                        <button class="btn btn-details" onclick="viewDAODetails('${addr}')">
                            <i class="fas fa-eye"></i> 查看詳細資料
                        </button>
                    </div>
                `;
                daoListDiv.appendChild(div);
            }
        } catch (err) {
            console.error("讀取 DAO 失敗", err);
            daoListDiv.innerHTML = '<div class="status-message status-error">載入 DAO 列表失敗: ' + err.message + '</div>';
        }
    }

    function viewDAODetails(daoAddress) {
        window.location.href = `dao-details.html?address=${daoAddress}`;
    }

    // Event listeners
    document.getElementById("createDaoBtn").addEventListener("click", createDAO);

    // 添加頁面可見性變化時的重新載入
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            // 頁面從後台切換到前台時，重新檢查錢包狀態
            console.log('頁面重新可見，檢查錢包狀態');
            loadWalletAddress();
        }
    });
</script>
{% endblock %}
