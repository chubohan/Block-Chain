        await loadHistoryClaims();

      // 在 initApp 函數中修改返回按鈕事件
document.getElementById("backButton").addEventListener("click", () => {

  window.history.back();
});

    // 添加一個函數來檢查理賠ID是否有效
async function isValidClaimId(claimId) {
  try {
    const claim = await daoContract.getClaim(claimId);
    // 如果申請者地址不是零地址，則認為是有效理賠
    return claim.claimant !== ethers.constants.AddressZero;
  } catch (err) {
    return false;
  }
}

// 修改後的 loadHistoryClaims 函數
async function loadHistoryClaims() {
  try {
    let totalClaims;
    
    // 優先嘗試 getTotalClaims()
    try {
      totalClaims = await daoContract.getTotalClaims();
    } catch (err) {
      console.log("getTotalClaims() 失敗，嘗試 claimCount");
      try {
        totalClaims = await daoContract.claimCount();
      } catch (err2) {
        console.log("所有方法都失敗，可能沒有理賠記錄");
        totalClaims = ethers.BigNumber.from(0);
      }
    }
    
    console.log("總理賠數量:", totalClaims.toString());
    
    const historyContainer = document.getElementById("historyContainer");
    historyContainer.innerHTML = "";

    if (totalClaims.eq(0)) {
      historyContainer.innerHTML = "<p>目前沒有歷史理賠記錄</p>";
      return;
    }

    // 加載所有理賠
    let validClaims = 0;
    for (let i = 0; i <= totalClaims.toNumber()-1; i++) {
      try {
        const claim = await daoContract.getClaim(i);
        if (claim.executed) {
          await renderClaim(i+1, claim, historyContainer);
          validClaims++;
        }
      } catch (err) {
        console.warn(`理賠 #${i} 無效:`, err.message);
        continue;
      }
    }
    
    if (validClaims === 0) {
      historyContainer.innerHTML = "<p>沒有已完成的理賠記錄</p>";
    }
    
  } catch (err) {
    console.error("載入歷史記錄失敗:", err);
    showError("無法載入歷史記錄: " + err.message);
  }
}



function showError(message) {
  const container = document.getElementById("historyContainer");
  container.innerHTML = `
    <div style="color: red; padding: 20px; border: 1px solid red; border-radius: 5px;">
      <h3>錯誤</h3>
      <p>${message}</p>
      <button onclick="loadHistoryClaims()" style="margin-top: 10px;">重試</button>
    </div>
  `;
}

    async function renderClaim(claimId, claim, container) {
  try {
    // 检查claim数据是否有效
    if (!claim || claim.claimant === "0x0000000000000000000000000000000000000000") {
      console.warn(`索赔 #${claimId} 数据无效`);
      return;
    }

    const isPassed = claim.yesVotes > claim.noVotes;
    const statusText = isPassed 
      ? '<span class="status-approved">✓ 已通过</span>' 
      : '<span class="status-rejected">✗ 已拒绝</span>';

    const claimDiv = document.createElement("div");
    claimDiv.className = "claim-item";
    claimDiv.innerHTML = `
      <h3>理赔 #${claimId}</h3>
      <div>申请人: ${claim.claimant}</div>
      <div>申请时间: ${new Date(claim.createdAt * 1000).toLocaleString()}</div>
      <div>金额: ${ethers.utils.formatEther(claim.amount)} ETH</div>
      <div>原因: ${claim.reason}</div>
      <div>状态: ${statusText}</div>
      <div>投票结果: 
        <span class="vote-count yes">赞成 ${claim.yesVotes.toString()}</span> / 
        <span class="vote-count no">反对 ${claim.noVotes.toString()}</span>
      </div>
    `;
    
    container.appendChild(claimDiv);
  } catch (err) {
    console.error(`渲染索赔 #${claimId} 时出错:`, err);
  }
}
