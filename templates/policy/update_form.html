{% extends "base.html" %}

{% block title %}測試樣板{% endblock %}

{% block extra_css %}
<link href="/static/css/update_form.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="container">        
    <div class="form-wrapper">
        <h2>保單管理系統</h2>

        <!-- 錢包連接區塊 -->
        <div class="section">
            <button type="button" class="btn btn-warning" onclick="connectWallet()" style="display: flex; justify-content: center">
              連接錢包
            </button>
            <p id="walletAddress">當前錢包狀態: 未連接</p>
        </div>

        <div class="divider"></div>
        
        <!-- 保單號碼輸入區塊 -->
        <div class="section">
            <h3>保單操作</h3>
            <div class="form-group mb-3">
                <label for="policyNumber" class="form-label">保單號碼:</label>
                <input type="text" id="policyNumber" class="form-control" placeholder="請輸入保單號碼">
            </div>

            <button onclick="loadPolicy()" type="submit" class="submit">
                <img src="{{ url_for('static', filename='imgs/refresh.png') }}" alt="Send Icon" class="icon">載入保單
            </button>
            
            <!-- 保單信息表單 -->
            <div id="policyForm" style="display:none;">
                <h3>修改保單資訊</h3>
                <div>
                    <label for="policyHolder">投保人姓名:</label>
                    <input type="text" id="policyHolder">
                </div>
                <div>
                    <label for="insuredPerson">被保人姓名:</label>
                    <input type="text" id="insuredPerson">
                </div>
                <div>
                    <label for="beneficiary">受益人:</label>
                    <input type="text" id="beneficiary">
                </div>
                <button onclick="updatePolicy()">更新保單</button>
            </div>
            
            <!-- PDF 更新區塊 -->
            <div id="pdfSection" style="margin-top:20px; display:none;">
                <h3>更新保單PDF</h3>
                <div style="margin: 10px 0;">
                    <input type="file" id="pdfUpload" accept=".pdf" style="display: none;">
                    <button onclick="document.getElementById('pdfUpload').click()">選擇PDF文件</button>
                    <span id="fileName"></span>
                    <button onclick="uploadAndUpdatePDF()">上傳並更新保單</button>
                </div>
                <p id="pdfStatus" class="loading">處理中，請稍候...</p>
            </div>
        </div>               
    </div>       
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="/static/js/update_form.js"></script>
{% endblock %}
